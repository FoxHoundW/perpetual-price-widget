[package]
name = "perpetual-price-widget"
version = "1.1.0"
description = "A lightweight Binance perpetual futures price widget"
authors = ["FoxHoundW"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "perpetual_price_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-http-proxy = { version = "1.2", features = ["runtime-tokio", "basic-auth"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
rust_decimal = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks", "system-proxy"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysproxy = "0.3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-socks = "0.5"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
